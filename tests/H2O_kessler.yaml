description: |-
  Kessler microphysics scheme for H2O

phases:
- name: vapor
  thermo: ideal-gas
  elements: [O, H]
  species: [(dry), H2O]

- name: cloud
  thermo: ideal-condensed
  elements: [O, H]
  species: [H2O(l), H2O(s), H2O(l)-rain, H2O(s)-snow]
  kinetics: gas
  reactions: [freezing, autoconversion]

- name: vapor:cloud
  thermo: ideal-surface
  adjacent-phases: [vapor, cloud]
  kinetics: surface
  reactions: [condensation, evaporation]

species:
- name: (dry)
  composition: {H: 2}
  thermo:
    model: constant-cp

- name: H2O
  composition: {H: 2, O: 1}

- name: H2O(l)
  composition: {H: 2, O: 1}
  thermo:
    model: constant-cp
  equation-of-state:
    model: constant-volume
    density: 1.E3 kg/m^3

- name: H2O(l)-rain
  composition: {H: 2, O: 1}
  thermo:
    model: constant-cp
  equation-of-state:
    model: constant-volume
    density: 1.E3 kg/m^3

- name: H2O(s)
  composition: {H: 2, O: 1}
  thermo:
    model: constant-cp
  equation-of-state:
    model: constant-volume
    density: 1.E3 kg/m^3

- name: H2O(s)-snow
  composition: {H: 2, O: 1}
  thermo:
    model: constant-cp
  equation-of-state:
    model: constant-volume
    density: 1.E3 kg/m^3

condensation:
- equation: H2O <=> H2O(l) # Reaction 1
  rate-constant: {A: 1, b: 0, Ea: 0}
- equation: H2O <=> H2O(s)  # Reaction 2
  rate-constant: {A: 1, b: 0, Ea: 0}

autoconversion:
- equation: H2O(l) => H2O(l)-rain  # Reaction 3
  rate-constant: {A: 1, b: 0, Ea: 0}
- equation: H2O(s) => H2O(s)-snow  # Reaction 4
  rate-constant: {A: 1, b: 0, Ea: 0}

evaporation:
- equation: H2O(l)-rain => H2O # Reaction 5
  rate-constant: {A: 1, b: 0, Ea: 0}
- equation: H2O(s)-snow => H2O # Reaction 6
  rate-constant: {A: 1, b: 0, Ea: 0}

freezing:
- equation: H2O(l) <=> H2O(s)  # Reaction 7
  type: freezing
  rate-constant: {A: 1, T: 273.16}
- equation: H2O(l)-rain <=> H2O(s)-snow  # Reaction 8
  type: freezing
  rate-constant: {A: 1, T: 273.16}
