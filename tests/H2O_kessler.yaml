phases:
- name: Kessler
  thermo: ideal-gas
  elements: [O, H]
  species: [H2O, H2O(l), H2O(s), H2O(l)-rain, H2O(s)-snow]
  kinetics: gas

species:
- name: H2O
  composition: {H: 2, O: 1}
- name: H2O(l)
  composition: {H: 2, O: 1}
- name: H2O(l)-rain
  composition: {H: 2, O: 1}
- name: H2O(s)
  composition: {H: 2, O: 1}
- name: H2O(s)-snow
  composition: {H: 2, O: 1}

reactions:
- equation: H2O <=> H2O(l) # Reaction 1
  type: condensation
- equation: H2O(l) <=> H2O(l)-rain  # Reaction 2
- equation: H2O(l)-rain <=> H2O # Reaction 3
  type: evaporation

- equation: H2O <=> H2O(s)  # Reaction 4
  type: condensation
- equation: H2O(s) <=> H2O(s)-snow  # Reaction 5
- equation: H2O(s)-snow <=> H2O # Reaction 6
  type: evaporation

- equation: H2O(l) <=> H2O(s)  # Reaction 7
  rate-constant: {A: 8.318e+21, b: -2, Ea: 0}
